[project]
name = "openboardroom"
version = "0.1.0"
description = "OpenBoardroom backend: EDGAR filings to ballot items in Postgres."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "anthropic==2.12.0",
    "jsonschema==4.26.0",
]

[project.scripts]
obr = "openboardroom.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "testcontainers[postgres]",
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openboardroom"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["openboardroom", "tests"]

[tool.coverage.run]
branch = true
source = ["openboardroom"]

[tool.coverage.report]
fail_under = 90
