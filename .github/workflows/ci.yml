name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Keep the tag in step with scripts/dump-schema.sh: the dump records the
      # exact server and pg_dump version.
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.9"
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright
      - name: Install dbmate
        run: |
          curl -fsSL -o dbmate https://github.com/amacneil/dbmate/releases/download/v2.38.2/dbmate-linux-amd64
          echo "4c6059e4e52558605d39e8c8075f3b15f96cac293043c0c71bb464d8950f235c  dbmate" | sha256sum -c -
          sudo install -m 0755 dbmate /usr/local/bin/dbmate
          dbmate --version
      - name: Check db/schema.sql matches the migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # The migrations grant to these roles; `infrastructure` creates them in production.
          docker exec "$PG_CONTAINER" psql -q -U postgres -c "create role pipeline_rw; create role web_ro;"
          # pg_dump must match the server's version, so run the service container's own.
          mkdir -p "$RUNNER_TEMP/shim"
          printf '#!/bin/sh\nexec docker exec -i %s pg_dump "$@"\n' "$PG_CONTAINER" > "$RUNNER_TEMP/shim/pg_dump"
          chmod +x "$RUNNER_TEMP/shim/pg_dump"
          export PATH="$RUNNER_TEMP/shim:$PATH"
          dbmate up
          dbmate dump
          git diff --exit-code db/schema.sql
      - run: uv run pytest --cov=openboardroom
      - name: Scan history with gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
